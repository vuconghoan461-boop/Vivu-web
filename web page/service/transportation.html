<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Di chuyển | VivuGo</title>
    <meta name="description" content="Đặt vé máy bay, tàu hỏa, xe khách và dịch vụ đưa đón sân bay." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../../assest/css.css" />

    <!-- Kiểu riêng cho form tìm chuyến bay. Có thể chuyển sang css.css nếu muốn dùng chung. -->
    <style>
      .vf-bar {
        padding: 16px;
        margin-bottom: 20px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      }

      /* Một chiều / Khứ hồi */
      .vf-trip {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 24px;
        margin-bottom: 14px;
      }
      .vf-trip label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 700;
        color: #1e293b;
        cursor: pointer;
      }
      .vf-trip input {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: #2563eb;
        cursor: pointer;
      }

      /* Hàng chính: nơi đi, nơi đến, ngày bay, nút tìm */
      .vf-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        align-items: end;
      }
      .vf-bar.is-round .vf-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .vf-field[hidden] { display: none; }
      .vf-field > label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #64748b;
      }
      .vf-ico {
        flex: none;
        width: 14px;
        height: 14px;
        stroke: #2563eb;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .vf-field select,
      .vf-field input[type="date"] {
        width: 100%;
        height: 44px;
        padding: 0 12px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        color: #1e293b;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        text-overflow: ellipsis;
      }
      .vf-field select:focus,
      .vf-field input[type="date"]:focus {
        outline: 2px solid #3b82f6;
        outline-offset: 1px;
      }
      .vf-submit {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        padding: 0 20px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(90deg, #2563eb, #4f46e5);
        border: 0;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .vf-submit:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 14px rgba(37, 99, 235, 0.3);
      }
      .vf-submit .vf-ico { stroke: #fff; width: 16px; height: 16px; }

      /* Hàng lọc thêm: hãng bay, hạng ghế */
      .vf-extra {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 12px 24px;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid #f1f5f9;
      }
      .vf-extra .vf-field select { min-width: 220px; }
      .vf-seg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        padding: 4px;
        background: #f1f5f9;
        border-radius: 12px;
      }
      .vf-seg button {
        padding: 8px 16px;
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        color: #475569;
        background: transparent;
        border: 0;
        border-radius: 9px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .vf-seg button.is-active {
        color: #0f172a;
        background: #fff;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.15);
      }
      .vf-seg button[data-class="business"].is-active {
        color: #fff;
        background: #f59e0b;
      }

      .vf-msg {
        margin: 10px 0 0;
        font-size: 13px;
        font-weight: 600;
        color: #b42318;
      }
      .vf-msg:empty { display: none; }

      /* Kết quả */
      .vf-result + .vf-result { margin-top: 28px; }
      .vf-result-title {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 800;
        color: #0f172a;
      }
      .vf-result-count { font-weight: 600; color: #64748b; }
      .vf-empty {
        padding: 32px 16px;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
      }
      .vf-empty p {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 500;
        color: #64748b;
      }
      .vf-reset {
        padding: 0;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        color: #2563eb;
        background: none;
        border: 0;
        cursor: pointer;
      }
      .vf-reset:hover { text-decoration: underline; }

      @media (max-width: 1000px) {
        .vf-grid,
        .vf-bar.is-round .vf-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 560px) {
        .vf-grid,
        .vf-bar.is-round .vf-grid { grid-template-columns: 1fr; }
        .vf-extra .vf-field,
        .vf-extra .vf-field select { width: 100%; min-width: 0; }
      }
    </style>

    <script src="../../assest/js.js" defer></script>
    <script src="../../assest/Vehicles.js" defer></script>
  </head>
  <body class="site-body">

    <!--<div id="site-header"></div>-->

    <main>
      <div class="vivugo-container">
        <section class="section" style="border-top:none; padding-top:32px;" data-tab-group data-vehicles-src="../../data/Vehicles.json">

          <div class="tab-bar">
            <button type="button" class="tab-btn is-active" data-tab-target="tr-all">Tất cả</button>
            <button type="button" class="tab-btn" data-tab-target="tr-air">Máy bay</button>
            <button type="button" class="tab-btn" data-tab-target="tr-train">Tàu hỏa</button>
            <button type="button" class="tab-btn" data-tab-target="tr-bus">Xe khách</button>
            <button type="button" class="tab-btn" data-tab-target="tr-transfer">Đưa đón sân bay</button>
          </div>

          <!-- Các thẻ route-card được tạo tự động từ Vehicles.json bởi Vehicles.js -->
          <div class="tab-panel is-active" data-tab-panel="tr-all">
            <div class="route-list" data-list="all"><p>Đang tải dữ liệu…</p></div>
          </div>

          <!-- Tab Máy bay: form tìm chuyến bay + kết quả -->
          <div class="tab-panel" data-tab-panel="tr-air">

            <form class="vf-bar" data-flight-filter novalidate>

              <div class="vf-trip" role="radiogroup" aria-label="Loại vé">
                <label><input type="radio" name="flight-trip" value="one-way" checked /> Một chiều</label>
                <label><input type="radio" name="flight-trip" value="round-trip" /> Khứ hồi</label>
              </div>

              <div class="vf-grid">
                <div class="vf-field">
                  <label for="flight-from">
                    <svg class="vf-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
                    Nơi khởi hành
                  </label>
                  <select id="flight-from" data-f="from"></select>
                </div>

                <div class="vf-field">
                  <label for="flight-to">
                    <svg class="vf-ico" viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(90deg)"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
                    Nơi đến
                  </label>
                  <select id="flight-to" data-f="to"></select>
                </div>

                <div class="vf-field">
                  <label for="flight-date">
                    <svg class="vf-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                    Ngày bay
                  </label>
                  <input type="date" id="flight-date" data-f="date" />
                </div>

                <div class="vf-field" data-return-field hidden>
                  <label for="flight-return">
                    <svg class="vf-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                    Ngày về
                  </label>
                  <input type="date" id="flight-return" data-f="return" />
                </div>

                <button type="submit" class="vf-submit">
                  <svg class="vf-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                  Tìm chuyến bay
                </button>
              </div>

              <!-- Lọc thêm: có thể xóa khối này nếu không cần -->
              <div class="vf-extra">
                <div class="vf-field">
                  <label for="flight-airline">Hãng hàng không</label>
                  <select id="flight-airline" data-f="airline">
                    <option value="all">Tất cả các hãng</option>
                  </select>
                </div>

                <div class="vf-field">
                  <label id="flight-class-label">Hạng ghế</label>
                  <div class="vf-seg" role="group" aria-labelledby="flight-class-label">
                    <button type="button" class="is-active" data-class="economy" aria-pressed="true">Phổ thông</button>
                    <button type="button" data-class="business" aria-pressed="false">Thương gia</button>
                  </div>
                </div>
              </div>

              <p class="vf-msg" data-flight-msg role="alert"></p>
            </form>

            <div data-list="flight"></div>
          </div>

          <div class="tab-panel" data-tab-panel="tr-train">
            <div class="route-list" data-list="train"></div>
          </div>

          <div class="tab-panel" data-tab-panel="tr-bus">
            <div class="route-list" data-list="bus"></div>
          </div>

          <div class="tab-panel" data-tab-panel="tr-transfer">
            <div class="route-list" data-list="transfer"></div>
          </div>

        </section>
      </div>
    </main>

  </body>
</html>
