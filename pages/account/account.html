<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VivuGo - Trang cá nhân</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/account.css">
</head>
<body>
    <div class="profile" id="profile" hidden>
        <div class="cover"></div>
        <div class="head">
            <div class="avatar" id="avatar"></div>
            <div class="who">
                <h2 id="pName"></h2>
                <p class="tier">🥉 Bronze Priority · 0 điểm</p>
            </div>
            <button class="btn-out" id="logoutBtn" type="button">Đăng xuất</button>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="info" type="button">Thông tin cá nhân</button>
            <button class="tab" data-tab="calendar" type="button">Lịch của tôi</button>
        </div>

        <!-- Tab 1: thông tin tài khoản -->
        <section class="panel" id="panel-info">
            <dl class="info">
                <div><dt>Họ và tên</dt><dd id="iName"></dd></div>
                <div><dt>Email</dt><dd id="iEmail"></dd></div>
                <div><dt>Số điện thoại</dt><dd id="iPhone"></dd></div>
                <div><dt>Hạng thành viên</dt><dd>Bronze Priority</dd></div>
                <div><dt>Điểm tích lũy</dt><dd>0 điểm</dd></div>
            </dl>
        </section>

        <!-- Tab 2: Lịch của tôi = trang mycalendar của Linh, nhúng nguyên trạng bằng iframe (không sửa file của Linh) -->
        <section class="panel" id="panel-calendar" hidden>
            <iframe id="calFrame" title="Lịch của tôi" data-src="mycalendar/mycalendar.html"></iframe>
        </section>
    </div>

    <script src="../../js/account.js"></script>
</body>
</html>
