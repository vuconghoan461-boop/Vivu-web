<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VivuGo - Đăng nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/login.css">
</head>
<body>
    <div class="auth-wrap">
        <a class="logo" id="logo" href="../../index.html" title="Quay lại Trang chủ VivuGo">
            <img src="../../assets/LogoVivugo.png" alt="VivuGo">
        </a>
        <div class="auth-card">
            <div class="m-left"><h2>Khám phá thế giới cùng VivuGo!</h2></div>
            <div class="m-right">
                <div class="tabs">
                    <a class="tab active" id="toLogin" href="login.html">ĐĂNG NHẬP</a>
                    <a class="tab" id="toRegister" href="register.html">ĐĂNG KÝ</a>
                </div>
                <p class="sso-title">Đăng nhập nhanh bằng Gmail, mạng xã hội hoặc Apple</p>
                <div class="sso">
                    <button type="button" data-provider="google"><i class="fa-brands fa-google" aria-hidden="true"></i><span>Google</span></button>
                    <button type="button" data-provider="facebook"><i class="fa-brands fa-facebook" aria-hidden="true"></i><span>Facebook</span></button>
                    <button type="button" data-provider="apple"><i class="fa-brands fa-apple" aria-hidden="true"></i><span>Apple</span></button>
                </div>
                <div class="or"><span>hoặc dùng tài khoản VivuGo</span></div>
                <form id="login" class="form active" novalidate>
                    <div class="field">
                        <input id="lEmail" placeholder=" " autocomplete="username">
                        <label for="lEmail">Email hoặc số điện thoại</label>
                        <small class="err"></small>
                    </div>
                    <div class="field">
                        <input id="lPass" type="password" placeholder=" " autocomplete="current-password">
                        <label for="lPass">Mật khẩu</label>
                        <span class="eye" role="button" aria-label="Hiện/ẩn mật khẩu"><i class="fa-regular fa-eye open" aria-hidden="true"></i><i class="fa-regular fa-eye-slash off" aria-hidden="true"></i></span>
                        <small class="err"></small>
                    </div>
                    <div class="opts">
                        <label><input type="checkbox" id="remember" checked> Ghi nhớ đăng nhập</label>
                        <a href="javascript:void(0)" id="forgotBtn">Quên mật khẩu?</a>
                    </div>
                    <button type="submit" class="btn-full">Đăng nhập</button>
                    <p class="hint">Demo: demo@vivugo.vn | Nick mới: new@vivugo.vn (MK: 12345678)</p>
                </form>
            </div>
        </div>
        <a class="back-home" href="../../index.html"><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ</a>
    </div>
    <script src="../../js/userlogic.js"></script>
    <script src="../../js/login.js"></script>
</body>
</html>
