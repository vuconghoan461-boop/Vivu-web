    var stars = parseInt($("newRevStars").value) || 5;

    if (!name || !comment) {
      showToast("Vui lòng điền họ tên và nội dung cảm nhận!");
      return;

    var a = A.filter(function (x) { return x.id === artId; })[0];

      var newRev = {

        date: "Hôm nay",
        tag: "Đã xác thực du khách",
        comment: comment,
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80"

    if (e.key === "Enter") handleCardClick(e);
  });

  $("back").onclick = show;
  $("q").oninput = list;
  $("reg").onchange = list;
  window.addEventListener("hashchange", route);

  // Khởi tạo
  list();
  route();

  // Tự động nạp dữ liệu mới nhất từ articles.json khi chạy qua Go Live / Live Server
  if (window.fetch && (location.protocol === 'http:' || location.protocol === 'https:')) {
    fetch('articles.json')
      .then(function (res) {
        if (res.ok) return res.json();
      })
      .then(function (jsonData) {
        if (Array.isArray(jsonData) && jsonData.length > 0) {
          A = jsonData;
          list();
          route();
          console.log('✅ VivuGo: Đã nạp thành công ' + A.length + ' bài viết từ articles.json');
        }
      })
      .catch(function () {});
  }
})();
</script>

</body>
</html>
