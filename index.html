<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khám phá điểm đến | VivuGo - Cẩm nang & Đặt tour trọn gói</title>
  <meta name="description" content="30 bài viết cẩm nang du lịch hấp dẫn khắp Việt Nam. Đọc xong có thể đặt tour trọn gói ngay trong bài viết mà không bị gián đoạn trải nghiệm." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --blue: #0a8de0;
      --blue-d: #0773bd;
      --blue-soft: #e8f4fc;
      --orange: #e8930c;
      --orange-d: #cf8008;
      --ink: #1c2a3a;
      --muted: #64748b;
      --line: #e2e8f0;
      --card-bg: #ffffff;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Be Vietnam Pro", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: #f8fafc;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1200px, 100% - 32px); margin-inline: auto; }
    button { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    /* Header chuẩn theo đúng ảnh chụp thương hiệu VivuGo */
    .hd { position: sticky; top: 0; z-index: 40; background: #fff; border-bottom: 1px solid #eef2f6; box-shadow: 0 1px 6px rgba(0,0,0,0.03); }
    .hd .wrap { display: flex; align-items: center; justify-content: space-between; gap: 20px; height: 76px; }
    
    .logo { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; text-decoration: none; flex-shrink: 0; }
    .logo-icon-svg { width: 44px; height: 44px; display: block; overflow: visible; }
    .logo-brand { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; display: inline-flex; align-items: center; line-height: 1; }
    .brand-vivu { color: #0088e8; }
    .brand-go { color: #f59e0b; position: relative; display: inline-flex; align-items: center; margin-left: 1px; }
    .brand-sparkle { position: absolute; top: -10px; right: -8px; width: 22px; height: 14px; }

    .nav { display: flex; gap: 8px; align-items: center; }
    .nav-btn-link { background: transparent; color: #475569; border: 1.5px solid transparent; border-radius: 9999px; padding: 9px 20px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .nav-btn-link:hover { color: #0088e8; background: #f0f9ff; }
    
    .nav-btn-active { background: #0088e8; color: #fff; border: 0; border-radius: 9999px; padding: 10px 24px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,136,232,0.25); }
    .nav-btn-active:hover { background: #0077cc; }

    .nav-link { color: #475569; font-size: 15px; font-weight: 500; padding: 8px 14px; text-decoration: none; transition: color 0.2s; border-radius: 8px; }
    .nav-link:hover { color: #0088e8; background: #f8fafc; }

    .hd-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .ico-circle { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #e2e8f0; background: #fff; display: grid; place-items: center; cursor: pointer; transition: all 0.2s; padding: 0; }
    .ico-circle:hover { border-color: #cbd5e1; background: #f8fafc; transform: translateY(-1px); }
    .ico-circle .badge { position: absolute; top: -3px; right: -3px; background: #f59e0b; color: #fff; font-size: 11px; font-weight: 800; width: 19px; height: 19px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }

    .btn-blue { background: #0088e8; color: #fff; border: 0; border-radius: 9px; padding: 10px 22px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 6px rgba(0,136,232,0.2); }
    .btn-blue:hover { background: #0077cc; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,136,232,0.3); }
    .btn-blue:active { transform: translateY(0); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; cursor: pointer; background: var(--blue); color: #fff; font-weight: 600; font-size: 14.5px; padding: 10px 20px; border-radius: 10px; text-align: center; transition: all 0.2s; }
    .btn:hover { background: var(--blue-d); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-o { background: #fff; color: var(--blue); border: 1.5px solid var(--blue); }
    .btn-o:hover { background: var(--blue-soft); }
    .btn-or { background: var(--orange); color: #fff; }
    .btn-or:hover { background: var(--orange-d); box-shadow: 0 4px 12px rgba(232,147,12,0.25); }

    /* Hero */
    .hero { background: linear-gradient(135deg, #0a95e8 0%, #0070bd 100%); border-radius: 0 0 24px 24px; padding: 42px 0 54px; color: #fff; }
    .hero h1 { font-size: clamp(28px, 4vw, 44px); margin: 0 0 24px; color: #ffffff; font-weight: 900; letter-spacing: -0.02em; }
    
    /* Search bar */
    .sbar { display: grid; grid-template-columns: 2fr 1.2fr auto; background: #fff; border-radius: 14px; margin-top: 0; padding: 8px 12px; gap: 0; box-shadow: 0 12px 36px rgba(0,60,110,.25); }
    .sf { padding: 6px 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; }
    .sf label { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; }
    .sf input, .sf select { width: 100%; border: 0; font: inherit; font-size: 15px; padding: 4px 0; background: transparent; color: var(--ink); font-weight: 600; outline: none; }
    .sbar .btn { margin-left: 8px; align-self: center; padding: 13px 28px; border-radius: 10px; font-size: 15px; }

    /* Topic Chips & Stats */
    .controls-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin: 32px 0 20px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 500; cursor: pointer; color: #4a5a6a; transition: all 0.2s; }
    .chip:hover { border-color: var(--blue); color: var(--blue); }
    .chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; box-shadow: 0 2px 8px rgba(10,141,224,0.25); }
    .stat-badge { font-size: 13px; font-weight: 600; color: #64748b; background: #fff; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); }

    /* Featured Post */
    .feat { display: grid; grid-template-columns: 1.25fr 1fr; border: 1px solid var(--line); border-top: 3.5px solid var(--orange); border-radius: 18px; overflow: hidden; margin-bottom: 30px; background: #fff; box-shadow: 0 4px 20px rgba(20,40,60,.06); cursor: pointer; transition: transform 0.25s, box-shadow 0.25s; }
    .feat:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(20,40,60,.12); }
    .feat .cover { min-height: 320px; font-size: 26px; }
    .feat-b { padding: 32px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
    .feat-b h2 { margin: 0; font-size: 25px; line-height: 1.3; font-weight: 800; color: #0f172a; }
    .kick { font-size: 12.5px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: 0.05em; display: inline-flex; align-items: center; gap: 4px; }
    .meta { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
    .ex { color: #475569; margin: 0; font-size: 15px; line-height: 1.6; }

    /* Cards Grid */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding-bottom: 64px; }
    .card { border: 1px solid var(--line); border-top: 2.5px solid var(--orange); border-radius: 16px; overflow: hidden; background: #fff; cursor: pointer; display: flex; flex-direction: column; box-shadow: 0 2px 10px rgba(20,40,60,.04); transition: transform 0.25s, box-shadow 0.25s; }
    .card:nth-child(even) { border-top-color: var(--blue); }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 28px rgba(20,40,60,.1); border-color: #cbd5e1; }
    
    /* Cover Image Container with Image fallback */
    .cover {
      position: relative;
      height: 190px;
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      align-items: flex-end;
      padding: 14px 16px;
      color: #fff;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,.6);
    }
    .cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.75) 100%);
      pointer-events: none;
      z-index: 1;
    }
    .cover img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .card:hover .cover img {
      transform: scale(1.06);
    }
    .cover span {
      position: relative;
      z-index: 2;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .card-b { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .card-b h3 { margin: 0; font-size: 17.5px; line-height: 1.35; font-weight: 700; color: #0f172a; }
    .card-b p { margin: 0; font-size: 13.5px; color: #64748b; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-f { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13.5px; font-weight: 700; color: var(--orange); display: flex; justify-content: space-between; align-items: center; }
    .card-f span:last-child { color: var(--blue); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .card:hover .card-f span:last-child { text-decoration: underline; }

    .none { text-align: center; padding: 56px 16px; border: 1px dashed var(--line); border-radius: 16px; grid-column: 1/-1; background: #fff; }

    /* Reader View (Đọc bài viết & Đặt tour không gián đoạn) */
    [hidden] { display: none !important; }
    .back { display: inline-flex; align-items: center; gap: 6px; margin: 24px 0 12px; color: var(--blue); font-weight: 600; font-size: 14.5px; cursor: pointer; background: none; border: 0; padding: 0; }
    .back:hover { text-decoration: underline; color: var(--blue-d); }
    .reader { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 44px; padding-bottom: 72px; }
    
    .rcover { height: 350px; border-radius: 18px; margin: 16px 0 28px; position: relative; overflow: hidden; }
    .rcover img { width: 100%; height: 100%; object-fit: cover; }
    .rcover span { position: absolute; bottom: 20px; left: 20px; z-index: 2; font-size: 16px; background: rgba(0,0,0,0.7); padding: 6px 14px; border-radius: 8px; color: #fff; }
    
    .art h1 { font-size: clamp(26px, 3.5vw, 36px); line-height: 1.25; margin: 8px 0 12px; font-weight: 800; color: #0f172a; }
    .body { max-width: 68ch; }
    .body h2 { font-size: 21px; margin: 32px 0 10px; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 8px; }
    .body p { font-size: 16.5px; line-height: 1.8; margin: 0 0 16px; color: #334155; }
    
    /* Inline Tour CTA Card (Gợi ý ngay trong mạch đọc) */
    .cta { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--blue-soft); border: 1.5px solid #b9e1fb; border-left: 5px solid var(--blue); border-radius: 14px; padding: 18px 22px; margin: 28px 0; max-width: 68ch; box-shadow: 0 4px 12px rgba(10,141,224,0.06); }
    .cta b { display: block; font-size: 16px; color: #0c4a6e; }
    .cta small { color: #0369a1; font-size: 13px; font-weight: 500; }
    
    /* Sticky Sidebar Đặt tour */
    .side { position: sticky; top: 96px; align-self: start; border: 1px solid var(--line); border-top: 4px solid var(--orange); border-radius: 16px; padding: 24px; box-shadow: 0 8px 28px rgba(20,40,60,.08); background: #fff; }
    .side h3 { margin: 0 0 4px; font-size: 19px; font-weight: 800; line-height: 1.3; color: #0f172a; }
    .side .meta { margin-bottom: 12px; display: block; font-size: 12.5px; }
    .price { color: var(--orange); font-weight: 800; font-size: 24px; margin: 8px 0 16px; }
    .price small { font-size: 13.5px; color: var(--muted); font-weight: 500; }
    .fld { margin-bottom: 14px; }
    .fld label { display: block; font-size: 12px; font-weight: 700; color: #4a5a6a; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.03em; }
    .fld input { width: 100%; font: inherit; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 14px; color: var(--ink); font-weight: 500; outline: none; }
    .fld input:focus { border-color: var(--blue); }
    .side .btn { width: 100%; padding: 13px; font-size: 15px; }
    .side .sub { display: block; text-align: center; margin-top: 14px; font-size: 14px; color: var(--blue); font-weight: 600; }
    .side .sub:hover { text-decoration: underline; }
    
    .more { border-top: 1px solid var(--line); padding-top: 32px; margin-top: 40px; }
    .more h3 { margin: 0 0 16px; font-size: 20px; font-weight: 700; }
    .more .grid { grid-template-columns: repeat(2, 1fr); padding-bottom: 0; }
    
    /* Mobile sticky booking bar */
    .mbar { display: none; }

    /* Footer */
    .ft { background: #0e2236; color: #a9bccd; padding: 30px 0; font-size: 14px; border-top: 1px solid rgba(255,255,255,0.06); }
    .ft .wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .ft a { color: #fff; font-weight: 600; }
    .ft a:hover { text-decoration: underline; color: var(--blue-soft); }

    /* Toast popup khi đặt tour */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      background: #0f172a;
      color: #fff;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #334155;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    #toast.show {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 1000px) {
      .nav { display: none; }
      .hd .wrap { justify-content: space-between; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .feat { grid-template-columns: 1fr; }
      .feat .cover { min-height: 220px; }
      .reader { grid-template-columns: 1fr; }
      .side { display: none; }
      .mbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line); padding: 12px 18px; align-items: center; justify-content: space-between; gap: 14px; box-shadow: 0 -4px 18px rgba(0,0,0,.08); }
      body.reading .mbar { display: flex; }
      body.reading .ft { padding-bottom: 90px; }
    }
    @media (max-width: 640px) {
      .grid, .more .grid { grid-template-columns: 1fr; }
      .sbar { grid-template-columns: 1fr; }
      .sf { border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 6px; }
      .sbar .btn { margin: 10px 0 0; }
      .hd-right .btn-blue:last-child { display: none; }
      .controls-row { flex-direction: column; align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>

<!-- Header (Theo đúng 100% hình ảnh thực tế thương hiệu VivuGo) -->
<header class="hd">
  <div class="wrap">
    <!-- Logo VivuGo -->
    <a href="#" onclick="show(); return false;" class="logo" aria-label="VivuGo - Trang chủ">
      <svg class="logo-icon-svg" viewBox="0 0 160 120" fill="none">
        <!-- Vòng cung swoosh vàng cam phía dưới -->
        <path d="M26 86C16 78 14 62 25 50C38 36 68 40 85 58C96 70 108 76 122 74" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" fill="none"/>
        <!-- Biểu tượng ghim định vị xanh dương -->
        <path d="M62 16C45 16 31 30 31 47C31 70 62 96 62 96S93 70 93 47C93 30 79 16 62 16Z" fill="#0088e8"/>
        <!-- Vòng tròn trắng bên trong -->
        <circle cx="62" cy="46" r="21" fill="#ffffff"/>
        <!-- Núi và sóng biển xanh -->
        <path d="M46 54C50 49 56 46 62 46C68 46 74 49 78 54C72 58 52 58 46 54Z" fill="#0284c7"/>
        <!-- Mặt trời vàng rực rỡ -->
        <circle cx="62" cy="36" r="5" fill="#f59e0b"/>
        <!-- Chiếc máy bay vàng cam bay lên góc phải -->
        <path d="M84 26L96 44L84 38L79 41L82 33L70 27L84 26Z" fill="#f59e0b"/>
      </svg>
      <span class="logo-brand">
        <span class="brand-vivu">Vivu</span><span class="brand-go">Go<svg class="brand-sparkle" viewBox="0 0 24 16" fill="none"><circle cx="4" cy="11" r="2.2" fill="#f59e0b"/><circle cx="12" cy="4" r="2.6" fill="#f59e0b"/><circle cx="20" cy="9" r="2.2" fill="#f59e0b"/></svg></span>
      </span>
    </a>

    <!-- Menu điều hướng ngang: Đang ở Khám phá điểm đến (nền xanh), Dịch vụ không xanh -->
    <nav class="nav" aria-label="Điều hướng chính">
      <button class="nav-btn-link" type="button" onclick="showToast('Chuyển sang module Đặt dịch vụ (Khách sạn, Tour, Vé xe)');">Dịch vụ</button>
      <button class="nav-btn-active" type="button" onclick="show();">Khám phá điểm đến</button>
      <a class="nav-link" href="#" onclick="showToast('Xem Lịch trình chuyến đi của tôi'); return false;">Lịch của tôi</a>
      <a class="nav-link" href="#" onclick="showToast('Trợ lý AI VivuGo lập kế hoạch du lịch thông minh'); return false;">Trợ lý AI</a>
      <a class="nav-link" href="#" onclick="showToast('Thông tin tài khoản cá nhân'); return false;">Tài khoản</a>
    </nav>

    <!-- Khu vực bên phải: Nút máy bay có badge 1 + 2 nút Đăng nhập & Đăng ký màu xanh -->
    <div class="hd-right">
      <button class="ico-circle" type="button" onclick="showToast('Bạn có 1 chuyến đi đang chờ hoàn tất');" aria-label="Lịch bay & Chuyến đi">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3.5c-.5-.5-2.5 0-4 1.5L13.5 8.5 5.3 6.7c-.5-.1-.9.1-1.2.4l-.8.8c-.3.3-.3.8-.1 1.2l4.8 4.8-2.5 2.5-2.1-.7c-.3-.1-.7 0-.9.2l-.7.7c-.3.3-.3.8 0 1.1l2.8 2.8 2.8 2.8c.3.3.8.3 1.1 0l.7-.7c.2-.2.3-.6.2-.9l-.7-2.1 2.5-2.5 4.8 4.8c.4.2.9.2 1.2-.1l.8-.8c.3-.3.5-.7.4-1.2z"/>
        </svg>
        <span class="badge">1</span>
      </button>
      <button class="btn-blue" type="button" onclick="showToast('Mở cửa sổ Đăng nhập');">Đăng nhập</button>
      <button class="btn-blue" type="button" onclick="showToast('Mở cửa sổ Đăng ký thành viên nhận quà 200k');">Đăng ký</button>
    </div>
  </div>
</header>

<main>
  <!-- ===== Danh sách bài viết khám phá điểm đến ===== -->
  <div id="listView">
    <section class="hero">
      <div class="wrap">
        <h1>Khám phá điểm đến Việt Nam</h1>
        
        <form class="sbar" id="sForm" onsubmit="return false">
          <div class="sf">
            <label for="q">Tìm bài viết</label>
            <input id="q" type="text" placeholder="VD: Đà Lạt, săn mây, Hạ Long, lặn san hô..." autocomplete="off" />
          </div>
          <div class="sf" style="border-right:0">
            <label for="reg">Vùng miền</label>
            <select id="reg">
              <option value="">Tất cả 3 vùng miền</option>
              <option>Miền Bắc</option>
              <option>Miền Trung</option>
              <option>Miền Nam</option>
            </select>
          </div>
          <button class="btn" type="submit">Tìm bài viết</button>
        </form>
      </div>
    </section>

    <div class="wrap">

  var CATS = ["Tất cả", "Cẩm nang", "Lịch trình", "Ẩm thực", "Mẹo hay"], cat = "Tất cả";
  var $ = function (i) { return document.getElementById(i); };
  var fmt = function (n) { return n.toLocaleString("vi-VN") + "đ"; };
  var norm = function (s) { return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d"); };

  // Tạo khối ảnh bìa kèm nhãn điểm đến
  function makeCover(a, cls) {
    var imgTag = a.img ? '<img src="' + a.img + '" alt="' + a.dest + '" onerror="this.src=\'https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=800&q=80\'" />' : '';
    return '<div class="cover ' + (cls||"") + '">' + imgTag + '<span>📍 ' + a.dest + '</span></div>';
  }

  // Khởi tạo các nút chọn chủ đề
  CATS.forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = c;
    b.setAttribute("aria-pressed", String(c === cat));
    b.onclick = function () {
      cat = c;
      [].forEach.call($("chips").children, function (x) {
        x.setAttribute("aria-pressed", String(x === b));
      });
      list();
    };
    $("chips").appendChild(b);
  });

  // Tạo HTML cho từng thẻ bài viết trong lưới
  function cardHTML(a) {
    return '<article class="card" tabindex="0" data-id="' + a.id + '">' +
      makeCover(a) +
      '<div class="card-b">' +
        '<span class="kick">🏷️ ' + a.cat + ' · ' + a.region + '</span>' +
        '<h3>' + a.title + '</h3>' +
        '<p>' + a.ex + '</p>' +
        '<span class="meta">⏱️ ' + a.read + ' phút đọc</span>' +
        '<div class="card-f">' +
          '<span>Tour từ ' + fmt(a.tour.price) + '</span>' +
          '<span>Đọc bài →</span>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  // Lọc và hiển thị danh sách bài viết
  function list() {
    var q = norm($("q").value.trim());
    var r = $("reg").value;

    var res = A.filter(function (a) {
      var matchCat = (cat === "Tất cả" || a.cat === cat);
      var matchReg = (!r || a.region === r);
      var matchQ = (!q || norm([a.title, a.dest, a.ex, a.cat, a.region].join(" ")).indexOf(q) >= 0);
      return matchCat && matchReg && matchQ;
    });

    // Cập nhật số lượng bài viết tìm thấy
    $("artCountBadge").textContent = "Hiển thị " + res.length + " bài viết";

    var f = res[0];
    var rest = res.slice(1);

    // Bài viết nổi bật
    $("feat").innerHTML = f ? (
      '<article class="feat card" tabindex="0" data-id="' + f.id + '">' +
        makeCover(f) +
        '<div class="feat-b">' +
          '<span class="kick">⭐ Nổi bật · ' + f.cat + ' · ' + f.region + '</span>' +
          '<h2>' + f.title + '</h2>' +
          '<p class="ex">' + f.ex + '</p>' +
          '<span class="meta">⏱️ ' + f.read + ' phút đọc · Tour trọn gói từ ' + fmt(f.tour.price) + '/' + f.tour.unit + '</span>' +
          '<div><button class="btn btn-or" type="button">Đọc cẩm nang chi tiết →</button></div>' +
        '</div>' +
      '</article>'
    ) : '';

    // Lưới bài viết còn lại
    $("grid").innerHTML = rest.length ? rest.map(cardHTML).join("") : (
      f ? "" : '<div class="none"><h3>Chưa tìm thấy bài viết phù hợp</h3><p>Thử đổi chủ đề, xóa từ khóa hoặc chọn vùng miền khác.</p></div>'
    );
  }

  // Mở bài viết chi tiết & liên kết đặt tour trực tiếp
  function openArticle(id) {
    var a = A.filter(function (x) { return x.id === id; })[0];

    var bodyHTML = a.s.map(function (section, i) {
      return '<h2>📌 ' + section[0] + '</h2><p>' + section[1] + '</p>' + (i === 0 ? inlineCTA : '');
    }).join("");

    // Bài viết liên quan

    // Render bài viết
    $("art").innerHTML =

    $("sideBookBtn").onclick = function () {
      var guests = parseInt($("sg").value) || 1;
      var total = a.tour.price * guests;
      showToast('🎉 Đã giữ chỗ thành công ' + a.tour.name + ' cho ' + guests + ' khách (' + fmt(total) + '). Hướng dẫn viên VivuGo sẽ liên hệ ngay!');
    };

    // Mobile bottom bar
    $("mbar").innerHTML =
      '<div>' +
        '<div class="meta" style="font-size:12px">Tour gợi ý</div>' +
        '<b style="color:var(--orange);font-size:17px">' + fmt(a.tour.price) + '</b>' +
      '</div>' +
      '<button class="btn btn-or" type="button" onclick="bookTour(\'' + a.tour.name + '\', ' + a.tour.price + ')">Đặt tour ngay</button>';

    // Chuyển view sang Reader
    $("listView").hidden = true;
    $("readView").hidden = false;
    document.body.classList.add("reading");
    document.title = a.title + " | VivuGo";
    window.scrollTo(0, 0);
  }

  // Chuyển về màn hình danh sách
  window.show = function () {
    $("listView").hidden = false;
    $("readView").hidden = true;
    document.body.classList.remove("reading");
    document.title = "Khám phá điểm đến | VivuGo - Cẩm nang & Đặt tour trọn gói";
    history.pushState("", "", location.pathname);
  };

  // Lọc nhanh theo vùng miền trên menu header
  window.filterByReg = function (r) {
    show();
    $("reg").value = r;
    list();
    window.scrollTo({ top: 350, behavior: 'smooth' });
  };

  // Điều hướng qua hash URL
  function route() {
    var m = location.hash.match(/^#bai-viet\/(.+)$/);
    if (m) {
      openArticle(m[1]);
    } else {
      show();
    }
  }

  // Xử lý click mở bài viết
  function handleCardClick(e) {
    var c = e.target.closest("[data-id]");
    if (c) {
      location.hash = "bai-viet/" + c.getAttribute("data-id");
    }
  }

  // Hàm hiển thị thông báo Toast
  window.showToast = function (msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function () {
      t.classList.remove("show");
    }, 3500);
  };

  // Hàm đặt tour từ các nút CTA
  window.bookTour = function (name, price) {
    showToast('🎉 Đặt giữ chỗ ' + name + ' (' + fmt(price) + '/khách) thành công! Nhân viên tư vấn sẽ liên hệ lại trong 10 phút.');
  };

  document.addEventListener("click", handleCardClick);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") handleCardClick(e);
  });

  $("back").onclick = show;
  $("q").oninput = list;
  $("reg").onchange = list;
  window.addEventListener("hashchange", route);

  // Chạy khởi tạo
  list();
  route();

  // Tự động nạp dữ liệu mới nhất từ articles.json khi chạy qua Go Live / Web Server
  if (window.fetch && (location.protocol === 'http:' || location.protocol === 'https:')) {
    fetch('articles.json')
      .then(function (res) {
        if (res.ok) return res.json();
      })
      .then(function (jsonData) {
        if (Array.isArray(jsonData) && jsonData.length > 0) {
          A = jsonData;
          list();
          route();
          console.log('✅ VivuGo: Đã nạp thành công ' + A.length + ' bài viết từ articles.json');
        }
      })
      .catch(function () {
        // Fallback tự động: nếu offline hoặc file://, vẫn chạy mượt mà bằng 30 bài viết nhúng sẵn
      });
  }
})();
</script>
</body>
</html>
